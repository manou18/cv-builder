<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PioneerCV — CV &amp; Cover Letter Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="builder.css">

</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="mark">CV</div>
      <div>
        <h1 id="brandTitle">PioneerCV</h1>
        <span>American · Canadian · French templates</span>
      </div>
    </div>

    <div class="style-tabs" id="viewTabs"></div>
    <div class="country-tabs" id="countryTabs"></div>
    <div class="style-tabs" id="styleTabs"></div>

    <button class="btn-word" onclick="downloadWord()">📄<span class="label"> Download Word</span></button>
    <button class="btn-print" onclick="window.print()">🖨️<span class="label"> Print / Save as PDF</span></button>
  </div>

  <div class="workspace">
    <nav class="rail" id="sectionRail"></nav>
    <aside class="form-panel" id="formPanel"></aside>

    <section class="preview-panel" id="previewPanel">
      <div class="preview-toolbar">
        <span id="templateLabel"></span>
        <div class="zoom-ctl">
          <button onclick="setZoom(-0.05)">−</button>
          <span id="zoomLabel">70%</span>
          <button onclick="setZoom(0.05)">+</button>
        </div>
      </div>
      <div id="paperWrap" style="transform:scale(.7); transform-origin:top center;">
        <div class="paper" id="paper"></div>
      </div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="builder.js"></script>
</body>
</html>
